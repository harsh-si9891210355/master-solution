# Unified deployment compose for the Master Solution stack.
# Run from this directory:  docker compose up -d
# Paths are relative to deployment-scripts/; app source (backend, frontend,
# recordings, logs) lives one level up at the repo root (../).
services:
  db:
    image: postgres:16-alpine
    container_name: master-solution-db
    environment:
      POSTGRES_DB: master_solution
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d master_solution"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    image: postgres:16-alpine
    container_name: master-solution-db-init
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db-init/create_db_tables.sql:/docker-entrypoint-initdb.d/create_db_tables.sql:ro
      - ./db-init/insert_default_data.sql:/docker-entrypoint-initdb.d/insert_default_data.sql:ro
    command: >
      sh -c "
      psql postgresql://postgres:postgres@db:5432/master_solution -f /docker-entrypoint-initdb.d/create_db_tables.sql &&
      psql postgresql://postgres:postgres@db:5432/master_solution -f /docker-entrypoint-initdb.d/insert_default_data.sql
      "

  backend:
    build:
      context: ../backend
    container_name: master-solution-backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    env_file:
      - ../backend/.env
    environment:
      LOG_DIR: /logs/backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - ../logs/backend:/logs/backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  mediamtx:
    build:
      context: ./mediamtx
    container_name: master-solution-mediamtx
    ports:
      - "8554:8554"   # RTSP ingest from IP cameras
      - "9997:9997"   # MediaMTX HTTP API — backend uses this to register paths
      - "8889:8889"   # MediaMTX WebRTC live playback
      - "9996:9996"   # MediaMTX recorded playback API
      - "8189:8189/udp" # MediaMTX WebRTC media transport (UDP)
      - "8189:8189"   # MediaMTX WebRTC media transport (TCP fallback)
      - "9998:9998"   # MediaMTX metrics for monitoring and alerting
      - "9999:9999"   # MediaMTX performance profiling for debugging and optimization
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ../recordings:/recordings
      - ../logs/mediamtx:/logs/mediamtx
    restart: unless-stopped
    # --- GPU / NVENC recording (production) ---
    # The FFmpeg transcode runs inside this container. For hardware (NVENC)
    # encoding, set REC_ENCODER=nvenc in backend/.env AND uncomment below
    # (requires an NVIDIA GPU + NVIDIA Container Toolkit on the host):
    #   gpus: all
    #   environment:
    #     NVIDIA_VISIBLE_DEVICES: all
    #     NVIDIA_DRIVER_CAPABILITIES: compute,video

  frontend:
    build:
      context: ../frontend
    container_name: master-solution-frontend
    depends_on:
      - backend
    ports:
      - "8010:8010"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 8010

  nginx:
    image: nginx:alpine
    container_name: master-solution-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - mediamtx
    restart: unless-stopped

  # --- StreamHandler frame pipeline (RTSP -> JPEG -> Redis/RabbitMQ) -------
  redis:
    image: redis:7-alpine
    container_name: master-solution-redis
    # Frames are short-lived (claim-check with TTL); cap memory and evict
    # volatile keys first so a slow AI consumer can never OOM the broker.
    command: >
      redis-server
      --maxmemory 1gb
      --maxmemory-policy volatile-ttl
      --save ""
      --appendonly no
    ports:
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    # The "-management" image bundles the web dashboard (no extra service).
    image: rabbitmq:3.13-management
    container_name: master-solution-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP — producers/consumers
      - "15672:15672"   # Management UI: http://localhost:15672 (guest/guest)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  streamhandler:
    build:
      context: ../streamhandler
    container_name: master-solution-streamhandler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    env_file:
      - ../streamhandler/.env
    # These override anything in .env so the in-compose wiring always wins:
    # cameras come from the shared Postgres schema, not a YAML file.
    environment:
      SH_CAMERA_SOURCE: database
      SH_DATABASE_URL: postgresql://postgres:postgres@db:5432/master_solution
      SH_REDIS_URL: redis://redis:6379/0
      SH_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    volumes:
      - ../streamhandler:/app
    ports:
      - "9105:9105"   # Prometheus metrics
    restart: unless-stopped

  # --- Web UIs for inspecting the frame pipeline --------------------------
  # RabbitMQ queues / messages / rates are at the built-in management UI on
  # http://localhost:15672 (guest/guest) — no separate service needed.

  # Redis keys / frame hashes / TTLs:  http://localhost:5540
  # On first open, add a database with host "redis" and port 6379.
  redisinsight:
    image: redis/redisinsight:latest
    container_name: master-solution-redisinsight
    depends_on:
      - redis
    ports:
      - "5540:5540"
    restart: unless-stopped

  # --- Monitoring stack (merged from monitoring/docker-compose.yml) ---
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      # Land every user on the full-system Home dashboard by default.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/home.json
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.1.1
    container_name: promtail
    restart: unless-stopped
    ports:
      - "9080:9080"
    command:
      - -config.file=/etc/promtail/config.yml
    volumes:
      # Docker socket: promtail discovers containers + streams their logs (gives
      # real per-service labels). containers dir kept for the json log files.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"   # host port moved 8080 -> 8081 to avoid clash with nginx (8080:80)
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    # Mount the host's proc/sys/root so metrics reflect the HOST, not the
    # container. Without these, CPU/mem/disk readings are meaningless.
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@db:5432/master_solution?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yaml
    volumes:
      - ./monitoring/postgres-queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    ports:
      - "9187:9187"
    depends_on:
      db:
        condition: service_healthy

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: nginx-exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    ports:
      - "9113:9113"
    depends_on:
      - nginx

  # --- GPU metrics (CPU-only for now; enable on NVIDIA hosts) --------------
  # Requires nvidia-container-toolkit on the host. To enable: uncomment this
  # block, run it, and uncomment the "dcgm-exporter" scrape job in
  # monitoring/prometheus.yml.
  # dcgm-exporter:
  #   image: nvidia/dcgm-exporter:3.3.5-3.4.1-ubuntu22.04
  #   container_name: dcgm-exporter
  #   restart: unless-stopped
  #   runtime: nvidia
  #   environment:
  #     NVIDIA_VISIBLE_DEVICES: all
  #   cap_add: [SYS_ADMIN]
  #   ports:
  #     - "9400:9400"

volumes:
  postgres_data:
  grafana-storage:
  prometheus-data:
  loki-data:
  rabbitmq-data:
