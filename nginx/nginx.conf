events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # fMP4 media segments (.m4s) — not in the standard nginx mime.types
    types {
        video/mp4  m4s;
    }

    gzip            on;
    gzip_min_length 1000;
    gzip_types      text/plain application/json application/vnd.apple.mpegurl;

    server {
        listen 80;

        # ── FastAPI backend ───────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend:8000;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # ── DVR HLS static files ─────────────────────────────────────────────
        # Written by dvr-worker to /var/www/hls/camera-{id}/.
        # URL: /streams/camera-{id}/index.m3u8  (manifest)
        #      /streams/camera-{id}/init.mp4     (codec init)
        #      /streams/camera-{id}/seg000000.m4s … (2-second fMP4 segments)
        #
        # Caching is fully disabled:
        #   etag off + if_modified_since off  → no ETag/Last-Modified sent,
        #   so the browser has nothing to revalidate and cannot receive 304.
        #   no-store                          → browser must not cache at all.
        location /streams/ {
            alias       /var/www/hls/;
            sendfile    on;
            tcp_nopush  on;
            tcp_nodelay on;

            etag              off;
            if_modified_since off;

            add_header  Cache-Control                "no-store, no-cache, must-revalidate" always;
            add_header  Pragma                       "no-cache"                            always;
            add_header  Access-Control-Allow-Origin  "*"                                   always;
            add_header  Access-Control-Allow-Methods "GET, OPTIONS"                        always;
            expires     -1;
        }

        # ── Vite dev server (HMR requires HTTP/1.1 + WebSocket upgrade) ──────
        location / {
            proxy_pass         http://frontend:8010;
            proxy_set_header   Host       $host;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 86400s;
        }
    }
}
