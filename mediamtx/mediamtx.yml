logLevel: info
logDestinations: [stdout]

# API — used by the backend to dynamically add/update camera paths
api: yes
apiAddress: :9997

# Grant unauthenticated access to publish, read, and the HTTP API.
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:
      - action: api
        path:

# RTSP ingest from IP cameras.
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

# Browser live playback.
webrtc: yes
webrtcAddress: :8889
webrtcAdditionalHosts: [localhost, 127.0.0.1]
webrtcLocalTCPAddress: :8189
webrtcHandshakeTimeout: 10s 
webrtcTrackGatherTimeout: 2s

# RTMP / SRT not used.
hls: no
rtmp: no
srt: no

# Native recording playback API.
playback: yes
playbackAddress: :9996

# Record every path to disk with fragmented MP4 segments.
pathDefaults:
  record: yes
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 500ms
  recordSegmentDuration: 1h
  recordDeleteAfter: 12h

# Paths are managed dynamically via the API from the backend.
paths: {}
