logLevel: info
logDestinations: [stdout]

# API — used by the backend to dynamically add camera paths
api: yes
apiAddress: :9997

# Playback server — serves recorded fmp4 segments as HLS for DVR rewind
playback: yes
playbackAddress: :9996

# Grant unauthenticated access to publish, read, and the HTTP API.
# By default, newer MediaMTX does not include "api" in the any-user permissions.
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:
      - action: api
        path:

# RTSP server (ingest from IP cameras)
rtsp: yes
rtspAddress: :8554

# HLS server (optional, for fallback playback)
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: no
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

# WebRTC disabled — LL-HLS is used for both live and DVR playback
webrtc: no

# RTMP / SRT disabled
rtmp: no
srt: no

# NVR recording — enabled globally so every registered path records automatically.
# recordPath uses %path (camera name) and %f (microsecond ID, required by MediaMTX).
record: yes
recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
recordFormat: fmp4
recordSegmentDuration: 5m
recordDeleteAfter: 168h

# Paths are managed dynamically via the API from the backend.
# The backend calls POST /v3/config/paths/add/camera-{id} for each camera.
paths: {}
