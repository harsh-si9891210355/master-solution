logLevel: info
logDestinations: [stdout]

# API — used by the backend to dynamically add/update camera paths
api: yes
apiAddress: :9997

# Grant unauthenticated access to publish, read, and the HTTP API.
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: api
        path:

# RTSP ingest from IP cameras — the only MediaMTX role in the new DVR pipeline.
# FFmpeg workers pull rtsp://mediamtx:8554/camera-{id} and write rolling HLS.
rtsp: yes
rtspAddress: :8554

# HLS server disabled — DVR HLS is now generated by dvr-worker (FFmpeg)
# and served by nginx directly from disk.
hls: no

# Playback server disabled — replaced by the unified HLS DVR manifest.
playback: no

# WebRTC / RTMP / SRT not used
webrtc: no
rtmp: no
srt: no

# Recording disabled — dvr-worker's FFmpeg HLS pipeline is the single
# source of truth for both live viewing and rewind.
record: no

# Paths are managed dynamically via the API from the backend.
paths: {}
