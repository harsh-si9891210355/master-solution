events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip            on;
    gzip_min_length 1000;
    gzip_types      text/plain application/json application/vnd.apple.mpegurl;

    server {
        listen 80;

        # ── FastAPI backend ───────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend:8000;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # ── MediaMTX WebRTC live playback ────────────────────────────────────
        location /webrtc/ {
            proxy_pass         http://mediamtx:8889/;
            proxy_redirect     / /webrtc/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 86400s;
        }

        # ── MediaMTX recorded playback API ───────────────────────────────────
        location /playback/ {
            proxy_pass         http://mediamtx:9996/;
            proxy_redirect     / /playback/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            add_header         Access-Control-Allow-Origin "*" always;
        }

        # ── Vite dev server (HMR requires HTTP/1.1 + WebSocket upgrade) ──────
        location / {
            proxy_pass         http://frontend:8010;
            proxy_set_header   Host       $host;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 86400s;
        }
    }
}
