# All services live in the same Compose network, so Prometheus reaches them by
# their service name (not the host gateway IP). Container ports are used here,
# which are independent of the host port mappings in docker-compose.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "mediamtx"
    metrics_path: /metrics
    static_configs:
      - targets: ["mediamtx:9998"]

  - job_name: "streamhandler"
    metrics_path: /metrics
    static_configs:
      - targets: ["streamhandler:9105"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # --- GPU metrics: uncomment once the dcgm-exporter service is enabled in
  #     docker-compose.yml (NVIDIA hosts only). ---
  # - job_name: "gpu"
  #   static_configs:
  #     - targets: ["dcgm-exporter:9400"]

  # --- Event queue (not built yet): when a Redis/RabbitMQ broker + its
  #     exporter are added, register the exporter target here. e.g.
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]
