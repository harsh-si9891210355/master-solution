events {
    worker_connections 1024;
}

http {
    gzip            on;
    gzip_min_length 1000;
    gzip_types      text/plain application/json application/vnd.apple.mpegurl application/x-mpegURL;

    server {
        listen 80;

        # ── FastAPI backend ───────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend:8000;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # ── DVR playback (MediaMTX port 9996) ────────────────────────────────
        # /get returns a streaming fmp4 file — proxy_buffering off so bytes
        # reach the browser immediately rather than nginx spooling the full
        # file to disk first. CORS headers added because mediamtx:9996 sends none.
        location /dvr-proxy/ {
            proxy_pass         http://mediamtx:9996/;
            proxy_set_header   Host            mediamtx;
            proxy_buffering    off;

            add_header         Access-Control-Allow-Origin  "*" always;
            add_header         Access-Control-Allow-Methods "GET, OPTIONS" always;
        }

        # ── Live HLS (MediaMTX port 8888) ─────────────────────────────────────
        # proxy_buffering off is required for LL-HLS: parts arrive every 200ms
        # and must be forwarded immediately. mediamtx:8888 already sends
        # Access-Control-Allow-Origin: *, so no extra CORS headers needed.
        location /hls/ {
            proxy_pass         http://mediamtx:8888/;
            proxy_set_header   Host            mediamtx;
            proxy_buffering    off;
        }

        # ── Vite dev server (HMR requires HTTP/1.1 + WebSocket upgrade) ──────
        location / {
            proxy_pass         http://frontend:8010;
            proxy_set_header   Host       $host;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 86400s;
        }
    }
}
