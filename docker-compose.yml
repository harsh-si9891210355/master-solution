services:
  db:
    image: postgres:16-alpine
    container_name: master-solution-db
    environment:
      POSTGRES_DB: master_solution
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d master_solution"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    image: postgres:16-alpine
    container_name: master-solution-db-init
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./create_db_tables.sql:/docker-entrypoint-initdb.d/create_db_tables.sql:ro
      - ./insert_default_data.sql:/docker-entrypoint-initdb.d/insert_default_data.sql:ro
    command: >
      sh -c "
      psql postgresql://postgres:postgres@db:5432/master_solution -f /docker-entrypoint-initdb.d/create_db_tables.sql &&
      psql postgresql://postgres:postgres@db:5432/master_solution -f /docker-entrypoint-initdb.d/insert_default_data.sql
      "

  backend:
    build:
      context: ./backend
    container_name: master-solution-backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: master-solution-mediamtx
    ports:
      - "8554:8554"   # RTSP ingest from IP cameras
      - "9997:9997"   # MediaMTX HTTP API — backend uses this to register paths
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped

  # DVR worker: one FFmpeg process per camera, writes rolling HLS fMP4
  # playlists to ./recordings on the host; picks up new cameras by polling MediaMTX API.
  dvr-worker:
    build:
      context: ./dvr-worker
    container_name: master-solution-dvr-worker
    depends_on:
      - mediamtx
    volumes:
      - ./recordings:/var/www/hls
    environment:
      MEDIAMTX_API:     http://mediamtx:9997
      MEDIAMTX_RTSP:    rtsp://mediamtx:8554
      HLS_BASE:         /var/www/hls
      SEGMENT_DURATION: "4"    # seconds per fMP4 segment
      DVR_HOURS:        "2"    # rolling DVR window length
      POLL_INTERVAL:    "15"   # seconds between MediaMTX path polls
      RESTART_DELAY:    "5"    # seconds before restarting a failed FFmpeg
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: master-solution-frontend
    depends_on:
      - backend
    ports:
      - "8010:8010"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 8010

  nginx:
    image: nginx:alpine
    container_name: master-solution-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./recordings:/var/www/hls:ro   # serve DVR HLS files written by dvr-worker
    depends_on:
      - frontend
      - backend
      - dvr-worker
    restart: unless-stopped

volumes:
  postgres_data:
