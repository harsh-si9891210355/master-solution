services:
  db:
    image: postgres:16-alpine
    container_name: master-solution-db
    environment:
      POSTGRES_DB: master_solution
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d master_solution"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    image: postgres:16-alpine
    container_name: master-solution-db-init
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./create_db_tables.sql:/docker-entrypoint-initdb.d/create_db_tables.sql:ro
      - ./insert_default_data.sql:/docker-entrypoint-initdb.d/insert_default_data.sql:ro
    command: >
      sh -c "
      psql postgresql://postgres:postgres@db:5432/master_solution -f /docker-entrypoint-initdb.d/create_db_tables.sql &&
      psql postgresql://postgres:postgres@db:5432/master_solution -f /docker-entrypoint-initdb.d/insert_default_data.sql
      "

  backend:
    build:
      context: ./backend
    container_name: master-solution-backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Media service: connects directly to the DB, runs one FFmpeg process per
  # active camera, writes rolling HLS fMP4 playlists to ./recordings, and
  # exposes a REST API for health + stream status.
  media-service:
    build:
      context: ./media-service
    container_name: master-solution-media-service
    depends_on:
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./recordings:/var/www/hls
    environment:
      DATABASE_URL:     postgresql://postgres:postgres@db:5432/master_solution
      HLS_BASE:         /var/www/hls
      SEGMENT_DURATION: "2"
      DVR_HOURS:        "2"
      POLL_INTERVAL:    "15"
      RESTART_DELAY:    "5"
      MAX_BACKOFF:      "60"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: master-solution-frontend
    depends_on:
      - backend
    ports:
      - "8010:8010"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 8010

  nginx:
    image: nginx:alpine
    container_name: master-solution-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./recordings:/var/www/hls:ro   # serve DVR HLS files written by dvr-worker
    depends_on:
      - frontend
      - backend
      - media-service
    restart: unless-stopped

volumes:
  postgres_data:
